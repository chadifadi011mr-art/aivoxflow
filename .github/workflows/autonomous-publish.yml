# Autonomous content publishing — generate, gate, promote, deploy.
#
# This is the single unattended runner for the content pipeline. It runs on a
# schedule (and on demand), generates whatever is due in content/calendar.json,
# runs every editorial gate, promotes only what passes, builds the site, uploads
# it over FTP, and commits the generated articles + calendar back to the repo so
# state survives across runs. Nothing here relaxes a gate: run.mjs only promotes
# a draft after fact-check, sourcing, SEO, originality, images and editorial QA
# have all passed (exit 3 means a gate blocked it, which is recorded, not
# published). For the on-push build-and-verify CI, see publish.yml.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   AIVOXFLOW_AI_API_KEY          provider key (e.g. Gemini)
#   AIVOXFLOW_FTP_HOST            FTP host from hPanel
#   AIVOXFLOW_FTP_USER            FTP username
#   AIVOXFLOW_FTP_PASS            FTP password
# Optional secrets (sane defaults are set below):
#   AIVOXFLOW_AI_PROVIDER         default: gemini
#   AIVOXFLOW_AI_MODEL            default: gemini-flash-latest
#   AIVOXFLOW_SEARCH_PROVIDER     default: tavily (works keyless)
#   AIVOXFLOW_SEARCH_API_KEY      optional: 1,000 free credits/month
#   AIVOXFLOW_SITE_URL            default: https://aivoxflow.unaux.com
#   AIVOXFLOW_FTP_REMOTE_ROOT     default: public_html
#
# Emergency stop: create an empty file at content/SCHEDULER_STOP and commit it —
# the next run halts before generating or publishing anything. Delete it to
# resume. To pull a bad article after the fact:
#   node agents/scheduler.mjs --unpublish <slug> --deploy

name: autonomous-publish

on:
  schedule:
    # Twice a day. Calendar slots are written up to 24h ahead and the build
    # holds a piece until its slot, so this cadence publishes on time.
    - cron: '17 6,18 * * *'
  workflow_dispatch: {}

# One autonomous run at a time; a newer run never interrupts a running one.
concurrency:
  group: autonomous-publish
  cancel-in-progress: false

permissions:
  contents: write # push generated articles + calendar back to the repo

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Cheap offline guard: refuse to spend provider quota on a broken tree.
      - name: Pipeline correctness gate (offline)
        run: node tests/jobs.mjs

      # Secrets are injected as real env vars, which take precedence over any
      # agents/.local.env the scheduler would otherwise load (there is none here).
      - name: Generate + promote due articles
        id: gen
        env:
          AIVOXFLOW_AI_PROVIDER: ${{ secrets.AIVOXFLOW_AI_PROVIDER || 'gemini' }}
          AIVOXFLOW_AI_MODEL: ${{ secrets.AIVOXFLOW_AI_MODEL || 'gemini-flash-latest' }}
          AIVOXFLOW_AI_API_KEY: ${{ secrets.AIVOXFLOW_AI_API_KEY }}
          AIVOXFLOW_SEARCH_PROVIDER: ${{ secrets.AIVOXFLOW_SEARCH_PROVIDER || 'tavily' }}
          AIVOXFLOW_SEARCH_API_KEY: ${{ secrets.AIVOXFLOW_SEARCH_API_KEY }}
        run: |
          node agents/scheduler.mjs --once | tee "$RUNNER_TEMP/gen.log"
          n="$(grep -Eo '[0-9]+ article\(s\) published' "$RUNNER_TEMP/gen.log" | grep -Eo '^[0-9]+' | head -1 || echo 0)"
          echo "published=${n:-0}" >> "$GITHUB_OUTPUT"

      # Persist the generated articles and the calendar so state survives across
      # runs (each run starts from a fresh checkout). This runs even when nothing
      # was published, so a gate block (needs_review) or a failure is remembered
      # instead of being silently retried next run; the diff check skips empty
      # commits. [skip ci] keeps these bot commits from re-triggering CI.
      - name: Commit generated content
        run: |
          git config user.name "aivoxflow-bot"
          git config user.email "aivoxflow-bot@users.noreply.github.com"
          git add site/data/articles site/assets-src/articles content/calendar.json
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "content: update calendar + articles [skip ci]"
            git push
          fi

      # Upload the freshly built site. deploy.mjs does its own production build
      # (with AIVOXFLOW_SITE_URL), refuses a preview build, and smoke-tests the
      # live URL afterwards.
      - name: Deploy to host
        if: steps.gen.outputs.published != '0'
        env:
          AIVOXFLOW_SITE_URL: ${{ secrets.AIVOXFLOW_SITE_URL || 'https://aivoxflow.unaux.com' }}
          AIVOXFLOW_FTP_HOST: ${{ secrets.AIVOXFLOW_FTP_HOST }}
          AIVOXFLOW_FTP_USER: ${{ secrets.AIVOXFLOW_FTP_USER }}
          AIVOXFLOW_FTP_PASS: ${{ secrets.AIVOXFLOW_FTP_PASS }}
          AIVOXFLOW_FTP_REMOTE_ROOT: ${{ secrets.AIVOXFLOW_FTP_REMOTE_ROOT || 'public_html' }}
          AIVOXFLOW_FTP_SSL: ${{ secrets.AIVOXFLOW_FTP_SSL }}
        run: node deploy/deploy.mjs
