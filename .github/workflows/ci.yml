name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build (production mode)
        run: npm run build
        env:
          AIVOXFLOW_SITE_URL: https://aivoxflow.com
      - name: Structural, SEO and accessibility checks
        run: npm test
      - name: Responsive checks (skips without Edge)
        run: npm run test:responsive
        continue-on-error: true
      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build
        run: npm run build
        env:
          AIVOXFLOW_SITE_URL: https://aivoxflow.com
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          staticDistDir: ./dist
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 1
