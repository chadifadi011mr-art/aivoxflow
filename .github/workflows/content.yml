name: Content pipeline

# Fills the calendar, generates any article whose slot is inside the lead
# window, and — when every quality gate passed and the piece was committed —
# uploads the built site to the live host over FTP. Runs daily so each piece is
# written ahead of its slot and goes live when that slot arrives.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   AIVOXFLOW_AI_API_KEY      your model key (or omit and use a self-hosted runner with Ollama)
#   AIVOXFLOW_SEARCH_API_KEY  optional; tavily runs keyless without it (rate-limited)
#   AIVOXFLOW_FTP_HOST        FTP host from hPanel (deploy step)
#   AIVOXFLOW_FTP_USER        FTP username
#   AIVOXFLOW_FTP_PASS        FTP password
# Optional (Actions variables): AIVOXFLOW_AI_PROVIDER, AIVOXFLOW_AI_MODEL,
#   AIVOXFLOW_IMAGE_PROVIDER, AIVOXFLOW_IMAGE_MODEL, AIVOXFLOW_SITE_URL,
#   AIVOXFLOW_FTP_REMOTE_ROOT, AIVOXFLOW_FTP_SSL, AIVOXFLOW_AI_BUDGET_USD_DAILY.
#
# Nothing is committed unless every quality gate passed, and nothing is deployed
# unless something new was committed.
#
# Emergency stop: commit an empty content/SCHEDULER_STOP file — the scheduler
# halts before generating or publishing, so nothing new is committed or
# deployed. Delete it to resume. To pull a bad live article:
#   node agents/scheduler.mjs --unpublish <slug> --deploy

on:
  schedule:
    # 09:00 UTC daily — deliberately AFTER the Gemini free-tier quota resets.
    # The free tier allows only 20 generate_content requests/day/project/model,
    # and that daily window rolls over at midnight Pacific: 07:00 UTC during PDT
    # (Mar–Nov) and 08:00 UTC during PST (Nov–Mar). The previous 04:00 UTC slot
    # ran ~3h BEFORE the reset, so any exhausted prior-day quota made the run
    # fail with HTTP 429. 09:00 UTC clears both boundaries with margin, so each
    # run starts on a fresh daily quota.
    - cron: '0 9 * * *'   # 09:00 UTC daily (after the free-tier quota reset)
  workflow_dispatch:
    inputs:
      slots:
        description: 'How many future slots to plan'
        default: '7'
      limit:
        description: 'Max articles to generate this run'
        default: '1'

permissions:
  contents: write

concurrency:
  group: content-pipeline
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # NOTE: `secrets` is not a valid context in a job-level `if` expression —
    # that form made the whole workflow invalid. The key check now runs as a
    # first step and the remaining steps read its output.
    steps:
      - name: Check for a provider key
        id: key
        # The key only gates whether to run; keeping it off the job level stops
        # it (and the provider settings) leaking into the verify step, where the
        # suite must run hermetically in mock mode.
        env:
          AIVOXFLOW_AI_API_KEY: ${{ secrets.AIVOXFLOW_AI_API_KEY }}
        run: |
          if [ -z "$AIVOXFLOW_AI_API_KEY" ]; then
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AIVOXFLOW_AI_API_KEY is not set; skipping this run."
          else
            echo "has=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: ${{ steps.key.outputs.has == 'true' }}
      - uses: actions/setup-node@v4
        if: ${{ steps.key.outputs.has == 'true' }}
        with:
          node-version: '22'

      - name: Plan the next slots
        if: ${{ steps.key.outputs.has == 'true' }}
        run: node agents/plan.mjs --slots "${{ github.event.inputs.slots || 7 }}"

      - name: Generate what is due
        if: ${{ steps.key.outputs.has == 'true' }}
        # Only the generate step talks to providers; verify runs hermetically.
        env:
          AIVOXFLOW_AI_PROVIDER: ${{ vars.AIVOXFLOW_AI_PROVIDER || 'gemini' }}
          AIVOXFLOW_AI_MODEL: ${{ vars.AIVOXFLOW_AI_MODEL || 'gemini-flash-latest' }}
          AIVOXFLOW_AI_API_KEY: ${{ secrets.AIVOXFLOW_AI_API_KEY }}
          AIVOXFLOW_SEARCH_PROVIDER: ${{ vars.AIVOXFLOW_SEARCH_PROVIDER || 'tavily' }}
          AIVOXFLOW_SEARCH_API_KEY: ${{ secrets.AIVOXFLOW_SEARCH_API_KEY }}
          # Hosted images in CI (no GPU). Use `local` if you prefer zero cost.
          AIVOXFLOW_IMAGE_PROVIDER: ${{ vars.AIVOXFLOW_IMAGE_PROVIDER || 'pollinations' }}
          AIVOXFLOW_IMAGE_MODEL: ${{ vars.AIVOXFLOW_IMAGE_MODEL || 'flux' }}
          AIVOXFLOW_AI_BUDGET_USD_DAILY: ${{ vars.AIVOXFLOW_AI_BUDGET_USD_DAILY || '2' }}
        run: node agents/scheduler.mjs --once --limit "${{ github.event.inputs.limit || 1 }}"

      - name: Build and verify
        if: ${{ steps.key.outputs.has == 'true' }}
        run: |
          node site/build.mjs
          node tests/jobs.mjs
          node tests/providers.mjs
          node tests/run.mjs

      - name: Commit published articles
        id: commit
        if: ${{ steps.key.outputs.has == 'true' }}
        run: |
          git config user.name  "aivoxflow-bot"
          git config user.email "bot@aivoxflow.com"
          git add site/data/articles site/assets-src/articles content/calendar.json
          if git diff --cached --quiet; then
            echo "Nothing to publish."
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "content: scheduled article(s) $(date -u +%Y-%m-%d)"
            git push
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      # deploy.mjs does its own production build (with AIVOXFLOW_SITE_URL),
      # refuses a preview build, and smoke-tests the live URL afterwards.
      - name: Deploy to host
        if: ${{ steps.key.outputs.has == 'true' && steps.commit.outputs.published == 'true' }}
        env:
          AIVOXFLOW_SITE_URL: ${{ vars.AIVOXFLOW_SITE_URL || 'https://aivoxflow.unaux.com' }}
          AIVOXFLOW_FTP_HOST: ${{ secrets.AIVOXFLOW_FTP_HOST }}
          AIVOXFLOW_FTP_USER: ${{ secrets.AIVOXFLOW_FTP_USER }}
          AIVOXFLOW_FTP_PASS: ${{ secrets.AIVOXFLOW_FTP_PASS }}
          AIVOXFLOW_FTP_REMOTE_ROOT: ${{ secrets.AIVOXFLOW_FTP_REMOTE_ROOT || 'public_html' }}
          AIVOXFLOW_FTP_SSL: ${{ secrets.AIVOXFLOW_FTP_SSL }}
        run: node deploy/deploy.mjs
