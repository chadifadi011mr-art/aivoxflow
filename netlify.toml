[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NODE_OPTIONS = ""
  # Arms the production guard in site/config.mjs: the build fails loudly if
  # AIVOXFLOW_SITE_URL is missing instead of publishing without SEO features.
  AIVOXFLOW_ENVIRONMENT = "production"

# Headers live in dist/_headers (generated by site/build.mjs) so the CSP can
# stay in sync with the analytics configuration.

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "index, follow"

[[headers]]
  for = "/search/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"
